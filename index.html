<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taquería El Trompo — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== CONFIGURA AQUÍ CADA CLIENTE ====== */
  /* Colores de la marca del negocio */
  :root {
    --fondo: #FFF6DB;
    --superficie: #FFFFFF;
    --tinta: #2A1A0F;
    --tinta-suave: #6B5444;
    --verde: #1E6B41;
    --verde-texto: #FFFFFF;
    --rosa: #D3216B;
    --borde: #EAD9B0;
    --chip: #FCEBB6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #1C130C;
      --superficie: #2A1D13;
      --tinta: #FCEFD4;
      --tinta-suave: #CDB79C;
      --verde: #38A86A;
      --verde-texto: #0F1A12;
      --rosa: #FF5C9A;
      --borde: #4A3524;
      --chip: #3A2818;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fondo: #1C130C; --superficie: #2A1D13; --tinta: #FCEFD4; --tinta-suave: #CDB79C;
    --verde: #38A86A; --verde-texto: #0F1A12; --rosa: #FF5C9A; --borde: #4A3524; --chip: #3A2818;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: 96px;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--fondo);
  }
  .envoltura { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* Letrero */
  .letrero { padding: 28px 0 18px; text-align: center; }
  .letrero .nombre {
    font-family: "Bowlby One", "Arial Black", Impact, sans-serif;
    font-size: clamp(2.2rem, 11vw, 3.4rem);
    line-height: .95;
    color: var(--rosa);
    letter-spacing: .01em;
    text-shadow: 3px 3px 0 var(--verde);
  }
  .letrero .datos { margin-top: 12px; color: var(--tinta-suave); font-size: .95rem; }
  .estado {
    display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px;
    background: var(--verde); color: var(--verde-texto); font-weight: 600; font-size: .85rem;
  }

  /* Categorías */
  .categorias {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--fondo); padding: 10px 0;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  }
  .categorias::-webkit-scrollbar { display: none; }
  .categorias a {
    flex: none; text-decoration: none; color: var(--tinta); background: var(--chip);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: .95rem;
  }
  .categorias a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid var(--rosa); outline-offset: 2px;
  }

  h2 {
    font-family: "Bowlby One", "Arial Black", Impact, sans-serif;
    font-weight: 400; font-size: 1.5rem; margin: 22px 0 6px; color: var(--verde);
  }
  .platillo {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
    padding: 14px 0; border-bottom: 2px dashed var(--borde);
  }
  .platillo .icono { font-size: 2rem; text-align: center; }
  .platillo .nom { font-weight: 700; }
  .platillo .desc { color: var(--tinta-suave); font-size: .9rem; }
  .platillo .precio { font-weight: 700; color: var(--rosa); margin-top: 2px; }

  .contador { display: flex; align-items: center; gap: 6px; }
  .contador button {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--verde);
    background: transparent; color: var(--verde); font-size: 1.25rem; font-weight: 700; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  .contador button.mas { background: var(--verde); color: var(--verde-texto); }
  .contador .cant { min-width: 20px; text-align: center; font-weight: 700; }
  .contador.vacio .menos, .contador.vacio .cant { display: none; }

  /* Barra inferior */
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--fondo); border-top: 2px solid var(--borde);
    transform: translateY(110%); transition: transform .25s ease;
  }
  .barra.visible { transform: translateY(0); }
  .boton {
    width: 100%; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; border: 0; border-radius: 14px; background: var(--verde); color: var(--verde-texto);
    font-family: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  }
  .boton.centro { justify-content: center; text-decoration: none; }

  /* Hoja de pedido */
  .fondo-hoja { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  .fondo-hoja.abierto { display: block; }
  .hoja {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90vh; overflow-y: auto;
    background: var(--superficie); border-radius: 22px 22px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); transition: transform .28s ease;
  }
  .hoja.abierta { transform: translateY(0); }
  .hoja .cont { max-width: 560px; margin: 0 auto; }
  .hoja h3 { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-weight: 400; font-size: 1.4rem; color: var(--verde); }
  .cerrar { float: right; background: none; border: 0; font-size: 1.6rem; color: var(--tinta-suave); cursor: pointer; }
  .resumen { margin: 14px 0; padding: 12px; background: var(--chip); border-radius: 12px; }
  .resumen .linea { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .resumen .total { border-top: 2px dashed var(--borde); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 1.1rem; }

  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, textarea, select {
    width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--borde);
    background: var(--fondo); color: var(--tinta); font-family: inherit; font-size: 1rem;
  }
  textarea { resize: vertical; min-height: 64px; }
  .opciones { display: flex; gap: 8px; }
  .opciones label {
    flex: 1; margin: 0; padding: 12px; text-align: center; border: 2px solid var(--borde); border-radius: 10px;
    cursor: pointer; font-weight: 600;
  }
  .opciones input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opciones input:checked + span { color: var(--verde); }
  .opciones label:has(input:checked) { border-color: var(--verde); background: var(--chip); }
  .opciones label:has(input:focus-visible) { outline: 3px solid var(--rosa); outline-offset: 2px; }
  .ayuda { font-size: .85rem; color: var(--tinta-suave); margin-top: 4px; }
  .error { color: var(--rosa); font-weight: 600; font-size: .9rem; margin-top: 10px; min-height: 1.2em; }
  .demo {
    margin-top: 16px; padding: 12px; border: 2px dashed var(--rosa); border-radius: 12px;
  }
  .demo label { margin-top: 0; }
  .oculto { display: none; }
  footer { text-align: center; color: var(--tinta-suave); font-size: .8rem; padding: 26px 0 8px; }

  @media (prefers-reduced-motion: reduce) {
    .barra, .hoja { transition: none; }
  }
</style>
</head>
<body>

<div class="envoltura">
  <header class="letrero">
    <div class="nombre" id="nombreNegocio">Taquería<br>El Trompo</div>
    <p class="datos" id="datosNegocio">Pide desde aquí y tu pedido llega directo a nuestro WhatsApp.</p>
    <span class="estado" id="horario">Abierto hoy de 6 pm a 1 am</span>
  </header>

  <nav class="categorias" id="categorias" aria-label="Categorías del menú"></nav>
  <main id="menu"></main>

  <footer>Menú digital de demostración</footer>
</div>

<div class="barra" id="barra">
  <button class="boton" id="verPedido" type="button">
    <span id="barraTexto">Ver mi pedido</span><span id="barraTotal">$0</span>
  </button>
</div>

<div class="fondo-hoja" id="fondoHoja"></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="tituloHoja">
  <div class="cont">
    <button class="cerrar" id="cerrarHoja" type="button" aria-label="Cerrar">×</button>
    <h3 id="tituloHoja">Tu pedido</h3>

    <div class="resumen" id="resumen"></div>

    <label for="nombre">Tu nombre</label>
    <input id="nombre" type="text" autocomplete="name" placeholder="Ej. Ana López">

    <label>¿Cómo lo quieres?</label>
    <div class="opciones">
      <label><input type="radio" name="entrega" value="Paso a recoger" checked><span>Paso a recoger</span></label>
      <label><input type="radio" name="entrega" value="A domicilio"><span>A domicilio</span></label>
    </div>

    <div id="bloqueDireccion" class="oculto">
      <label for="direccion">Dirección de entrega</label>
      <textarea id="direccion" placeholder="Calle, número, colonia y alguna referencia"></textarea>
    </div>

    <label for="pago">Forma de pago</label>
    <select id="pago">
      <option>Efectivo</option>
      <option>Transferencia</option>
      <option>Tarjeta al recibir</option>
    </select>

    <label for="notas">Notas (opcional)</label>
    <textarea id="notas" placeholder="Ej. sin cebolla, salsa aparte"></textarea>

    <div class="demo oculto" id="bloqueDemo">
      <label for="numeroDemo">Número que recibirá el pedido</label>
      <input id="numeroDemo" type="tel" inputmode="numeric" placeholder="10 dígitos, ej. 5512345678">
      <p class="ayuda">Esto es una demo: pon tu propio número y verás cómo te llega el pedido.</p>
    </div>

    <p class="error" id="error" role="alert"></p>
    <a class="boton centro" id="enviar" href="https://wa.me/" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>
  </div>
</section>

<script>
/* ====== CONFIGURA AQUÍ CADA CLIENTE ====== */
const CONFIG = {
  negocio: "Taquería El Trompo",
  // Número de WhatsApp del negocio, 10 dígitos. Déjalo vacío ("") para modo demo.
  whatsapp: "",
  costoEnvio: 25,
  menu: [
    { categoria: "Tacos", platillos: [
      { icono: "🌮", nombre: "Taco al pastor", desc: "Con piña, cebolla y cilantro", precio: 20 },
      { icono: "🌮", nombre: "Taco de suadero", desc: "Suave y jugoso", precio: 20 },
      { icono: "🌮", nombre: "Taco de bistec", desc: "Bistec a la plancha", precio: 22 },
      { icono: "🌮", nombre: "Taco campechano", desc: "Bistec con longaniza", precio: 24 },
      { icono: "🌮", nombre: "Taco de tripa", desc: "Bien dorada", precio: 25 }
    ]},
    { categoria: "Especialidades", platillos: [
      { icono: "🧀", nombre: "Gringa al pastor", desc: "Tortilla de harina con queso y pastor", precio: 65 },
      { icono: "🫓", nombre: "Quesadilla de bistec", desc: "Con queso Oaxaca", precio: 55 },
      { icono: "🌋", nombre: "Volcán", desc: "Tostada con queso gratinado y carne a elegir en notas", precio: 35 },
      { icono: "🍲", nombre: "Orden de 5 tacos al pastor", desc: "La más pedida", precio: 90 }
    ]},
    { categoria: "Bebidas", platillos: [
      { icono: "🥤", nombre: "Refresco 600 ml", desc: "Pregunta sabores en notas", precio: 30 },
      { icono: "🧉", nombre: "Agua de horchata 1 L", desc: "Hecha en casa", precio: 35 },
      { icono: "🍹", nombre: "Agua de jamaica 1 L", desc: "Hecha en casa", precio: 35 }
    ]}
  ]
};
/* ========================================= */

const carrito = {};
const todos = [];
const peso = n => "$" + n.toLocaleString("es-MX");
const idDe = (c, i) => "p" + c + "-" + i;

function pintarMenu() {
  const nav = document.getElementById("categorias");
  const menu = document.getElementById("menu");
  CONFIG.menu.forEach((cat, ci) => {
    const ancla = "cat" + ci;
    const a = document.createElement("a");
    a.href = "#" + ancla; a.textContent = cat.categoria;
    a.addEventListener("click", e => { e.preventDefault(); document.getElementById(ancla).scrollIntoView({ behavior: "smooth" }); });
    nav.appendChild(a);

    const h = document.createElement("h2");
    h.id = ancla; h.textContent = cat.categoria;
    menu.appendChild(h);

    cat.platillos.forEach((p, pi) => {
      const id = idDe(ci, pi);
      todos.push({ id, ...p });
      const fila = document.createElement("div");
      fila.className = "platillo";
      fila.innerHTML = `
        <div class="icono" aria-hidden="true">${p.icono}</div>
        <div>
          <div class="nom"></div>
          <div class="desc"></div>
          <div class="precio">${peso(p.precio)}</div>
        </div>
        <div class="contador vacio" data-id="${id}">
          <button class="menos" type="button" aria-label="Quitar uno">−</button>
          <span class="cant" aria-live="polite">0</span>
          <button class="mas" type="button" aria-label="Agregar uno">+</button>
        </div>`;
      fila.querySelector(".nom").textContent = p.nombre;
      fila.querySelector(".desc").textContent = p.desc;
      menu.appendChild(fila);
    });
  });

  menu.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const caja = btn.closest(".contador");
    const id = caja.dataset.id;
    const actual = carrito[id] || 0;
    const nuevo = btn.classList.contains("mas") ? actual + 1 : Math.max(0, actual - 1);
    if (nuevo === 0) delete carrito[id]; else carrito[id] = nuevo;
    caja.querySelector(".cant").textContent = nuevo;
    caja.classList.toggle("vacio", nuevo === 0);
    actualizarBarra();
  });
}

function lineas() {
  return todos.filter(p => carrito[p.id]).map(p => ({ ...p, cant: carrito[p.id], sub: p.precio * carrito[p.id] }));
}
function esDomicilio() { return document.querySelector('input[name="entrega"]:checked').value === "A domicilio"; }
function totales() {
  const sub = lineas().reduce((s, l) => s + l.sub, 0);
  const envio = esDomicilio() && sub > 0 ? CONFIG.costoEnvio : 0;
  return { sub, envio, total: sub + envio };
}

function actualizarBarra() {
  const piezas = Object.values(carrito).reduce((a, b) => a + b, 0);
  document.getElementById("barra").classList.toggle("visible", piezas > 0);
  document.getElementById("barraTexto").textContent = `Ver mi pedido (${piezas})`;
  document.getElementById("barraTotal").textContent = peso(totales().sub);
}

function pintarResumen() {
  const r = document.getElementById("resumen");
  const { sub, envio, total } = totales();
  r.innerHTML = "";
  lineas().forEach(l => {
    const d = document.createElement("div");
    d.className = "linea";
    d.innerHTML = `<span></span><span>${peso(l.sub)}</span>`;
    d.firstChild.textContent = `${l.cant} × ${l.nombre}`;
    r.appendChild(d);
  });
  if (envio) r.insertAdjacentHTML("beforeend", `<div class="linea"><span>Envío</span><span>${peso(envio)}</span></div>`);
  r.insertAdjacentHTML("beforeend", `<div class="linea total"><span>Total</span><span>${peso(total)}</span></div>`);
}

const hoja = document.getElementById("hoja");
const fondoHoja = document.getElementById("fondoHoja");
function abrir() { pintarResumen(); hoja.classList.add("abierta"); fondoHoja.classList.add("abierto"); document.getElementById("nombre").focus({ preventScroll: true }); }
function cerrar() { hoja.classList.remove("abierta"); fondoHoja.classList.remove("abierto"); }
document.getElementById("verPedido").addEventListener("click", abrir);
document.getElementById("cerrarHoja").addEventListener("click", cerrar);
fondoHoja.addEventListener("click", cerrar);
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

document.querySelectorAll('input[name="entrega"]').forEach(r => r.addEventListener("change", () => {
  document.getElementById("bloqueDireccion").classList.toggle("oculto", !esDomicilio());
  pintarResumen();
}));

if (!CONFIG.whatsapp) document.getElementById("bloqueDemo").classList.remove("oculto");

document.getElementById("enviar").addEventListener("click", (e) => {
  const error = document.getElementById("error");
  const nombre = document.getElementById("nombre").value.trim();
  const direccion = document.getElementById("direccion").value.trim();
  const notas = document.getElementById("notas").value.trim();
  const pago = document.getElementById("pago").value;
  const entrega = document.querySelector('input[name="entrega"]:checked').value;
  let numero = (CONFIG.whatsapp || document.getElementById("numeroDemo").value).replace(/\D/g, "");
  if (numero.length === 12 && numero.startsWith("52")) numero = numero.slice(2);

  const falla = t => { e.preventDefault(); error.textContent = t; error.scrollIntoView({ block: "center", behavior: "smooth" }); };
  if (!lineas().length) return falla("Agrega al menos un platillo.");
  if (!nombre) return falla("Escribe tu nombre para que sepamos de quién es el pedido.");
  if (esDomicilio() && !direccion) return falla("Escribe la dirección de entrega.");
  if (numero.length !== 10) return falla("El número de WhatsApp debe tener 10 dígitos.");
  error.textContent = "";

  const { envio, total } = totales();
  let msg = `*Nuevo pedido – ${CONFIG.negocio}*\n\n`;
  msg += `*Cliente:* ${nombre}\n*Entrega:* ${entrega}\n`;
  if (esDomicilio()) msg += `*Dirección:* ${direccion}\n`;
  msg += `\n*Pedido:*\n`;
  lineas().forEach(l => { msg += `• ${l.cant} × ${l.nombre}  ${peso(l.sub)}\n`; });
  if (envio) msg += `• Envío  ${peso(envio)}\n`;
  msg += `\n*Total: ${peso(total)}*\n*Pago:* ${pago}\n`;
  if (notas) msg += `*Notas:* ${notas}\n`;

  const url = `https://wa.me/52${numero}?text=${encodeURIComponent(msg)}`;
  document.getElementById("enviar").href = url;
});

document.getElementById("nombreNegocio").innerHTML = CONFIG.negocio.replace(/^(\S+)\s/, "$1<br>");
pintarMenu();
</script>
</body>
</html>
